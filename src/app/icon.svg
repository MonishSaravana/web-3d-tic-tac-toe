<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="3D tic tac toe">
  <rect width="64" height="64" rx="14" fill="#0b0d12"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2b3240" stroke-width="1.5"/>

  <!-- back layer: the second plane of the cube -->
  <g fill="#8d97a8" opacity="0.38">
    <circle cx="24" cy="16" r="3.1"/><circle cx="36" cy="16" r="3.1"/><circle cx="48" cy="16" r="3.1"/>
    <circle cx="24" cy="28" r="3.1"/><circle cx="36" cy="28" r="3.1"/><circle cx="48" cy="28" r="3.1"/>
    <circle cx="24" cy="40" r="3.1"/><circle cx="36" cy="40" r="3.1"/><circle cx="48" cy="40" r="3.1"/>
  </g>

  <!-- the winning line, drawn through the front layer -->
  <path d="M16 24 L40 48" stroke="#ef4444" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/>

  <!-- front layer -->
  <g fill="#ffffff">
    <circle cx="16" cy="24" r="4.2" fill="#ef4444"/><circle cx="28" cy="24" r="4.2"/><circle cx="40" cy="24" r="4.2"/>
    <circle cx="16" cy="36" r="4.2"/><circle cx="28" cy="36" r="4.2" fill="#ef4444"/><circle cx="40" cy="36" r="4.2"/>
    <circle cx="16" cy="48" r="4.2"/><circle cx="28" cy="48" r="4.2"/><circle cx="40" cy="48" r="4.2" fill="#ef4444"/>
  </g>
</svg>
